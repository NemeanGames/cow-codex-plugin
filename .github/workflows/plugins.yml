name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest==8.3.4
      - run: python scripts/validate_plugin.py plugins/cow
      - run: python scripts/check_public_content.py
      - run: python scripts/build_plugins.py --out dist
      - run: python -B -m pytest tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.os }}
          path: dist/
